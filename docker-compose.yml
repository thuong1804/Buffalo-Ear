services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: buffalo
            POSTGRES_PASSWORD: buffalo_local
            POSTGRES_DB: buffalo_ear
        ports:
            - "127.0.0.1:5438:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U buffalo -d buffalo_ear"]
            interval: 2s
            timeout: 3s
            retries: 20
volumes:
    postgres_data:
